# Fixture policy. Deliberately tight: the harness proves the rules, so the
# numbers here are small enough to trip on purpose.
schema = 1

types       = feat fix docs
subject_max = 40
bullet_max  = 2
body_cols   = 50

scope_fixed = engine conf
scope_root  = tests/commit-msg/roots/*/

trailer_person    = Co-Authored-By
trailer_reference = Refs
