# prettier over docs and data. Pinned: an upstream release must not turn a
# tree red. npx, not bunx - bun leaves stdio non-blocking.
#
# The config lane checks the whole tree when prettier's own config changes -
# it redefines "formatted" for every file. It never writes on commit:
# stage_fixed re-stages staged paths only, so a whole-tree write would leave
# the rest unstaged. The pattern is quoted: prettier expands it, not sh.
pre-commit:
  jobs:
    - name: prettier
      glob: &docs ["**/*.md", "**/*.json", "**/*.yml", "**/*.yaml"]
      file_types: &file [not symlink]
      run: npx --yes prettier@3.9.8 --write {staged_files}
      stage_fixed: true
    - name: prettier-config
      glob: &config [".prettierrc.json", ".prettierignore"]
      run: npx --yes prettier@3.9.8 --check '**/*.{md,json,yml,yaml}'

check:
  jobs:
    - name: prettier
      glob: *docs
      file_types: *file
      files: &changed "sh -c 'git diff --name-only --diff-filter=ACMR HEAD 2>/dev/null || git diff --cached --name-only --diff-filter=ACMR; git ls-files --others --exclude-standard'"
      run: npx --yes prettier@3.9.8 --check {files}
    - name: prettier-config
      glob: *config
      files: *changed
      run: npx --yes prettier@3.9.8 --check '**/*.{md,json,yml,yaml}'

fix:
  jobs:
    - name: prettier
      glob: *docs
      file_types: *file
      files: *changed
      run: npx --yes prettier@3.9.8 --write {files}
    - name: prettier-config
      glob: *config
      files: *changed
      run: npx --yes prettier@3.9.8 --write '**/*.{md,json,yml,yaml}'
