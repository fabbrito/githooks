# githooks' own policy. This repo vendors its own engine: .githooks/githooks
# is a copy of bin/githooks, and `make check` runs the copy, not the source.
schema = 1

types       = feat fix refactor chore style docs build perf test
subject_max = 72
bullet_max  = 2
body_cols   = 80

scope_fixed = engine conf tests make docs repo hooks release

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes

# require = true everywhere: the repo that ships the lane runner is the one
# place a silently skipped lane must be loud.
[group shell]
# .githooks/githooks is not listed: make vendor rewrites it from
# bin/githooks before every check, so it can never differ.
match   = *.sh bin/githooks .githooks/commit-msg .githooks/pre-commit
scope   = staged
require = true
run     = shfmt -i 0 -ci -d
fix     = shfmt -i 0 -ci -w
run     = shellcheck -x

# Pinned: an upstream prettier release must not turn the tree red. npx, not
# bunx - bun leaves stdio non-blocking and downstream tools then misbehave.
[group docs]
match   = *.md *.json *.yml *.yaml
scope   = staged
require = true
run     = npx --yes prettier@3.9.6 --check
fix     = npx --yes prettier@3.9.6 --write
